# Postgres for the integration tests: `bun run db:up`, then
# DATABASE_URL=postgres://postgres:postgres@localhost:54329/kysely_ddl bun test
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kysely_ddl
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kysely_ddl"]
      interval: 2s
      timeout: 3s
      retries: 20
