# Publishes to npm on a vX.Y.Z tag. The tag must match version in package.json.
# prepublishOnly runs typecheck, lint, tests (postgres needed) and the build.
#
# Auth: npm trusted publishing (OIDC). On npmjs.com the package trusts
# hehmonke/kysely-ddl with this workflow file (publish.yml), so no token secret
# is needed. Trusted publishing requires npm >= 11.5.1, hence the upgrade step.
name: Publish

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write # OIDC token for trusted publishing and provenance

env:
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/kysely_ddl

jobs:
  publish:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kysely_ddl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kysely_ddl"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing support
        run: npm install -g npm@latest && npm --version
      - name: Tag matches version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: bun install --frozen-lockfile
      - run: npm publish
